name: Build and Push Docker Image to GHCR
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ?????????????????????????????????
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Ubuntu????????????????

    steps:
      # 1. ?????????????????????
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Docker Buildx ????????Buildx??????????????????????
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. GitHub Container Registry (GHCR) ???????????????????????
      #    ??????????????????
      - name: Convert Repository Name to Lowercase
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 4. GitHub Container Registry ????????????? GitHub Token ????
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # GitHub??????
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub????????????

      # 5. Docker ????????????????????????
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }} # ?????Docker???????
          tags: |
            type=raw,value=latest # ?????????? "latest" ???
            type=sha,prefix=,suffix=,format=short # ????SHA????????

      # 6. Buildx Bake ????? Docker ?????????? GHCR ?????
      - name: Build and Push using Buildx Bake
        uses: docker/bake-action@v5
        with:
          files: ./docker-compose.yml # docker-compose.yml ????????
          push: true # ?????????? GHCR ?????
          # ???????????SHA??????
          set: |
            *.tags=ghcr.io/${{ env.REPO_LOWER }}:latest
            *.tags=ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}